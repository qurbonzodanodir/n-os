server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header OAI-Authenticated-User-Id $http_oai_authenticated_user_id;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Fingerprinted build output never changes, so it can be cached for a year.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # The shell and service worker must revalidate or updates never reach users.
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
