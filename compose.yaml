services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n_os
      POSTGRES_USER: n_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n_os -d n_os"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      N_OS_ENVIRONMENT: production
      N_OS_DATABASE_URL: postgresql+asyncpg://n_os:${POSTGRES_PASSWORD}@postgres:5432/n_os
      N_OS_FRONTEND_ORIGINS: '["${PUBLIC_ORIGIN:-http://localhost:8080}"]'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
